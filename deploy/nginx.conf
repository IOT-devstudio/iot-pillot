# 这是完整的 nginx 配置文件，会替换 /etc/nginx/nginx.conf，
# 因此必须包含 events 与 http 块 —— 只写一个 server 块 nginx 起不来。

user  nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid       /run/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;

    sendfile          on;
    keepalive_timeout 65;
    server_tokens     off;

    gzip              on;
    gzip_min_length   1024;
    gzip_types        text/css application/javascript application/json image/svg+xml;

    server {
        listen      80;
        server_name _;
        root        /var/www/html;
        index       index.html;

        # ── 运维探针 ─────────────────────────────────────────────────────
        # 必须显式反代。后端的健康检查挂在根级 /health（不在 /api/ 下），
        # 没有这条独立 location 它就会落进下面的 SPA fallback，
        # 在后端已经死透的情况下依然返回 200 + index.html ——
        # 那会悄无声息地废掉 deploy.yml 的自动回滚，坏版本反被判定成功。
        location = /health {
            proxy_pass http://127.0.0.1:8080;
            access_log off;
        }

        # ── 业务 API ────────────────────────────────────────────────────
        # proxy_pass 不带尾部斜杠 → 保留完整 URI，
        # /api/v1/login 原样送达后端的 /api/v1/login。
        # 若写成 http://127.0.0.1:8080/ 会把 /api/ 前缀剥掉，路由全部 404。
        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            # 当前无消费方，但将来在前面加 TLS 层时后端要靠它判断真实协议
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── 静态资源 ────────────────────────────────────────────────────
        # vite 产物带内容指纹（assets/index-<hash>.js），内容变了文件名就变，
        # 可以放心长缓存。
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # index.html 是路由入口，绝不能缓存，否则用户拿到旧的资源引用。
        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        # ── SPA fallback ────────────────────────────────────────────────
        # 放在最后。前端是 history 模式路由，未知路径要交回 index.html
        # 由前端路由处理，而不是返回 404。
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
