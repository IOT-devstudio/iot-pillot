          schema:
            allOf:
            - $ref: '#/definitions/response.Result'
            - properties:
                data:
                  $ref: '#/definitions/response.LoginResp'
              type: object
        "400":
          description: 参数错误、邮箱已注册或验证码错误
          schema:
            $ref: '#/definitions/response.Result'
      summary: 用户注册
      tags:
      - 认证模块
  /api/v1/reset-password:
    post:
      consumes:
      - application/json
      description: 公开接口：邮箱 + 验证码（purpose=reset）+ 新密码。
      parameters:
      - description: 重置密码请求参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.ResetPasswordReq'
      produces:
      - application/json
      responses:
        "200":
          description: 重置成功
          schema:
            $ref: '#/definitions/response.Result'
        "400":
          description: 参数错误、邮箱未注册或验证码错误
          schema:
            $ref: '#/definitions/response.Result'
      summary: 重置密码
      tags:
      - 认证模块
  /api/v1/send-reset-code:
    post:
      consumes:
      - application/json
      description: 向已注册邮箱发送 purpose=reset 的验证码，5 分钟内有效、只能使用一次、猜错 5 次即作废。
      parameters:
      - description: 验证目标（已绑定邮箱）
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.ResetCodeReq'
      produces:
      - application/json
      responses:
        "200":
          description: 发送验证码成功
          schema:
            $ref: '#/definitions/response.Result'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/response.Result'
        "429":
          description: 请求过于频繁
          schema:
            $ref: '#/definitions/response.Result'
      summary: 发送找回密码验证码
      tags:
      - 认证模块
  /api/v1/send-verify-code:
    post:
      consumes:
      - application/json
      description: 发送邮箱验证码，5 分钟内有效、只能使用一次、猜错 5 次即作废。
      parameters:
      - description: 验证目标
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.VerifyCodeReq'
      produces:
      - application/json
      responses:
        "200":
          description: 发送验证码成功
          schema:
            $ref: '#/definitions/response.Result'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/response.Result'
        "429":
          description: 请求过于频繁
          schema:
            $ref: '#/definitions/response.Result'
      summary: 发送验证码接口
      tags:
      - 认证模块
  /health:
    get:
      description: 不检查任何外部依赖，供容器存活探针使用。
      produces:
      - application/json
      responses:
        "200":
          description: 服务存活
          schema:
            $ref: '#/definitions/response.Result'
      summary: 健康检查（存活）
      tags:
      - 系统
  /health/ready:
    get:
      description: 探活 PostgreSQL 与 Redis；任一不可用返回 503。
      produces:
      - application/json
      responses:
        "200":
          description: 依赖均可用
          schema:
            $ref: '#/definitions/response.Result'
        "503":
          description: 依赖不可用
          schema:
            $ref: '#/definitions/response.Result'
      summary: 健康检查（就绪）
      tags:
      - 系统
securityDefinitions:
  BearerAuth:
    description: 登录得到的 access_token。Swagger UI 的 Authorize 里只填 token 本身，前缀由 UI 补。
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
