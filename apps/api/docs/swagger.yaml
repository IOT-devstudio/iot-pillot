basePath: /
definitions:
  request.AcceptInvitationReq:
    properties:
      token:
        maxLength: 200
        minLength: 10
        type: string
    required:
    - token
    type: object
  request.AdminUserIDReq:
    properties:
      user_id:
        minimum: 1
        type: integer
    required:
    - user_id
    type: object
  request.AdvanceCandidateReq:
    properties:
      action:
        enum:
        - send_offer
        - hire
        - reject
        type: string
      note:
        description: Note 随本次流转写入时间线的备注（如面试记录）。
        maxLength: 500
        type: string
      template_id:
        description: TemplateID offer / 感谢信模板 id；send_offer 与 reject 时必填。
        minimum: 1
        type: integer
      vars:
        allOf:
        - $ref: '#/definitions/request.MailVars'
        description: Vars 模板变量覆盖（offer / reject 发信时生效）。
    required:
    - action
    type: object
  request.ChangePasswordReq:
    properties:
      new_password:
        maxLength: 20
        minLength: 6
        type: string
      old_password:
        type: string
    required:
    - new_password
    - old_password
    type: object
  request.FormCreateReq:
    properties:
      description:
        type: string
      direction_code:
        type: string
      fields:
        items:
          $ref: '#/definitions/request.FormFieldReq'
        minItems: 1
        type: array
      round_id:
        type: integer
      title:
        type: string
    required:
    - direction_code
    - fields
    - round_id
    - title
    type: object
  request.FormFieldReq:
    properties:
      id:
        type: integer
      label:
        type: string
      options:
        items:
          type: string
        type: array
      placeholder:
        type: string
      required:
        type: boolean
      type:
        type: string
    required:
    - label
    - type
    type: object
  request.FormSubmitReq:
    properties:
      values:
        additionalProperties: {}
        type: object
    type: object
  request.FormUpdateReq:
    properties:
      description:
        type: string
      fields:
        items:
          $ref: '#/definitions/request.FormFieldReq'
        type: array
      is_open:
        type: boolean
      title:
        type: string
    type: object
  request.LoginReq:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  request.MailBatchDeleteReq:
    properties:
      ids:
        items:
          type: integer
        maxItems: 500
        minItems: 1
        type: array
    required:
    - ids
    type: object
  request.MailRecipientReq:
    properties:
      to_user_id:
        minimum: 1
        type: integer
      vars:
        $ref: '#/definitions/request.MailVars'
    required:
    - to_user_id
    type: object
  request.MailTemplateReq:
    properties:
      mail_example:
        maxLength: 5000
        type: string
      mail_model:
        maxLength: 20000
        minLength: 1
        type: string
      name:
        maxLength: 50
        minLength: 1
        type: string
      title:
        maxLength: 200
        minLength: 1
        type: string
      type:
        maxLength: 30
        minLength: 1
        type: string
    required:
    - mail_model
    - name
    - title
    - type
    type: object
  request.MailVars:
    additionalProperties:
      type: string
    type: object
  request.RecruitmentCreateDirectionReq:
    properties:
      code:
        type: string
      name:
        type: string
      sort_order:
        description: SortOrder 展示排序（小的在前），缺省 0。
        type: integer
    required:
    - code
    - name
    type: object
  request.RecruitmentReviewReq:
    properties:
      target:
        enum:
        - reviewing
        - accepted
        - rejected
        type: string
    required:
    - target
    type: object
  request.RecruitmentSetDirectionReq:
    properties:
      open:
        type: boolean
    type: object
  request.RecruitmentSetRoundReq:
    properties:
      accepting:
        type: boolean
    type: object
  request.RecruitmentSubmitReq:
    properties:
      direction_code:
        type: string
    required:
    - direction_code
    type: object
  request.RefreshReq:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  request.RegisterReq:
    properties:
      code:
        maxLength: 6
        minLength: 6
        type: string
      email:
        maxLength: 50
        type: string
      name:
        maxLength: 20
        minLength: 3
        type: string
      password:
        maxLength: 20
        minLength: 6
        type: string
    required:
    - code
    - email
    - name
    - password
    type: object
  request.ResetCodeReq:
    properties:
      email:
        maxLength: 50
        type: string
    required:
    - email
    type: object
  request.ResetPasswordReq:
    properties:
      code:
        maxLength: 6
        minLength: 6
        type: string
      email:
        maxLength: 50
        type: string
      new_password:
        maxLength: 20
        minLength: 6
        type: string
    required:
    - code
    - email
    - new_password
    type: object
  request.SendInvitationReq:
    properties:
      application_id:
        minimum: 1
        type: integer
      expires_in_days:
        description: ExpiresInDays 邀请有效天数；缺省 7，上限 90（再长就失去"限期响应"的语义）。
        maximum: 90
        minimum: 1
        type: integer
      template_id:
        description: TemplateID invitation 类型模板的 id；不存在或类型不符由服务层校验并报业务错误。
        minimum: 1
        type: integer
      vars:
        allOf:
        - $ref: '#/definitions/request.MailVars'
        description: |-
          Vars 模板变量覆盖。服务端会预填 invitation_token 等邀请上下文，
          调用方传同键会覆盖预填值。
    required:
    - application_id
    - template_id
    type: object
  request.SendMailBulkReq:
    properties:
      recipients:
        items:
          $ref: '#/definitions/request.MailRecipientReq'
        minItems: 1
        type: array
      template_id:
        minimum: 1
        type: integer
    required:
    - recipients
    - template_id
    type: object
  request.SendMailToEmailReq:
    properties:
      email:
        maxLength: 50
        type: string
      template_id:
        minimum: 1
        type: integer
      vars:
        $ref: '#/definitions/request.MailVars'
    required:
    - email
    - template_id
    type: object
  request.SendMailToUserReq:
    properties:
      template_id:
        minimum: 1
        type: integer
      to_user_id:
        minimum: 1
        type: integer
      vars:
        $ref: '#/definitions/request.MailVars'
    required:
    - template_id
    - to_user_id
    type: object
  request.UpdateMePatch:
    properties:
      class:
        description: 班级；null 清除，缺省不动
        example: 物联网工程 2301
        type: string
      direction:
        description: 方向；null/空串清除，缺省不动
        enum:
        - front-end
        - back-end
        - agent
        - all
        - game
        - other
        example: front-end
        type: string
      name:
        description: '姓名；null 清除，缺省不动（issue #86 新增可改字段）'
        example: 张三
        type: string
      qq:
        description: QQ；null 清除，缺省不动
        example: "1044696157"
        type: string
      student_id:
        description: 学号；null 清除（0 视为未填），缺省不动
        example: 2023114514
        type: integer
    type: object
  request.VerifyCodeReq:
    properties:
      purpose:
        description: |-
          Purpose 用途（issue #84）：register | reset。

          不带的旧请求一律按 register 处理，保证既有前端不改也能继续注册。
        enum:
        - register
        - reset
        type: string
      verifier:
        maxLength: 50
        minLength: 6
        type: string
      verifier_type:
        enum:
        - email
        - phone
        type: string
    required:
    - verifier
    - verifier_type
    type: object
  response.AcceptInvitationResp:
    properties:
      candidate:
        $ref: '#/definitions/response.MyCandidate'
    type: object
  response.AdminListResp:
    properties:
      items:
        items:
          $ref: '#/definitions/response.AdminUserResp'
        type: array
      total:
        type: integer
    type: object
  response.AdminMutationResp:
    properties:
      is_admin:
        type: boolean
      session_revoked:
        type: boolean
      user_id:
        type: integer
    type: object
  response.AdminUserListResp:
    properties:
      items:
        items:
          $ref: '#/definitions/response.AdminUserResp'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  response.AdminUserResp:
    properties:
      created_at:
        type: string
      detail:
        allOf:
        - $ref: '#/definitions/response.UserProfileDetail'
        description: |-
          Detail 只读资料（issue #57）：管理员能看到完整信息，但改不了——
          编辑入口只有本人的 PUT /me。
      is_admin:
        description: IsAdmin 由 Redis 名单现算，方便管理端直接标注"当前是不是管理员"
        type: boolean
      is_deleted:
        description: |-
          IsDeleted 账号是否已注销（issue #142 Q3：历史保留，列表标注）。
          false = 正常账号；true = 软删行，前端显示「账号已注销」。
        type: boolean
      name:
        type: string
      user_id:
        type: integer
    type: object
  response.CandidateDetailResp:
    properties:
      candidate:
        $ref: '#/definitions/response.CandidateResp'
      timeline:
        items:
          $ref: '#/definitions/response.CandidateTimelineResp'
        type: array
    type: object
  response.CandidateListResp:
    properties:
      items:
        items:
          $ref: '#/definitions/response.CandidateResp'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  response.CandidateResp:
    properties:
      application_id:
        type: integer
      created_at:
        type: string
      direction:
        type: string
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      status:
        type: string
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  response.CandidateTimelineResp:
    properties:
      created_at:
        type: string
      from_status:
        type: string
      note:
        type: string
      operator_id:
        type: integer
      to_status:
        type: string
    type: object
  response.FormDetailResp:
    properties:
      fields:
        items:
          $ref: '#/definitions/response.FormFieldResp'
        type: array
      form:
        $ref: '#/definitions/response.FormResp'
    type: object
  response.FormFieldResp:
    properties:
      id:
        type: integer
      label:
        type: string
      options:
        items:
          type: string
        type: array
      placeholder:
        type: string
      required:
        type: boolean
      sort_order:
        type: integer
      type:
        type: string
    type: object
  response.FormListResp:
    properties:
      items:
        items:
          $ref: '#/definitions/response.FormResp'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  response.FormResp:
    properties:
      created_at:
        type: string
      description:
        type: string
      direction_code:
        type: string
      id:
        type: integer
      is_open:
        type: boolean
      round_id:
        type: integer
      share_token:
        type: string
      submission_count:
        type: integer
      title:
        type: string
      updated_at:
        type: string
    type: object
  response.FormSubmissionListResp:
    properties:
      items:
        items:
          $ref: '#/definitions/response.FormSubmissionResp'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  response.FormSubmissionResp:
    properties:
      application_id:
        type: integer
      form_id:
        type: integer
      id:
        type: integer
      submitted_at:
        type: string
      submitter_id:
        type: integer
      values:
        additionalProperties: {}
        type: object
    type: object
  response.InvitationListResp:
    properties:
      items:
        items:
          $ref: '#/definitions/response.InvitationResp'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  response.InvitationResp:
    properties:
      accepted_at:
        type: string
      application_id:
        type: integer
      created_at:
        type: string
      email_sent_at:
        description: EmailSentAt 空串表示邮件从未投递成功——此时不算「已邀请」，允许重试投递。
        type: string
      expires_at:
        type: string
      id:
        type: integer
      sent_by:
        type: integer
      status:
        type: string
    type: object
  response.LoginResp:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      user_id:
        type: integer
    type: object
  response.MailBatchDeleteResp:
    properties:
      deleted:
        type: integer
    type: object
  response.MailBulkSendResp:
    properties:
      failed:
        items:
          $ref: '#/definitions/response.MailSendFailure'
        type: array
      sent:
        items:
          $ref: '#/definitions/response.MailSendResp'
        type: array
      total:
        type: integer
    type: object
  response.MailModelListResp:
    properties:
      items:
        items:
          $ref: '#/definitions/response.MailModelResp'
        type: array
      total:
        type: integer
    type: object
  response.MailModelResp:
    properties:
      id:
        type: integer
      mail_example:
        type: string
      mail_model:
        type: string
      name:
        type: string
      title:
        type: string
      type:
        type: string
      variables:
        description: Variables 模板里用到的变量名，管理端据此提示"这封模板需要哪些变量"
        items:
          type: string
        type: array
    type: object
  response.MailRecordListResp:
    properties:
      items:
        items:
          $ref: '#/definitions/response.MailRecordResp'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  response.MailRecordResp:
    properties:
      created_at:
        type: string
      from_user_id:
        type: integer
      id:
        type: integer
      title:
        type: string
      to_email:
        type: string
      to_user_id:
        type: integer
    type: object
  response.MailSendFailure:
    properties:
      reason:
        type: string
      to_email:
        type: string
      to_user_id:
        type: integer
    type: object
  response.MailSendResp:
    properties:
      title:
        description: Title 是渲染之后的实际主题（不是模板原文），便于确认变量替换是否正确
        type: string
      to_email:
        type: string
      to_user_id:
        type: integer
    type: object
  response.MeResp:
    properties:
      detail:
        $ref: '#/definitions/response.UserProfileDetail'
      is_founding:
        description: |-
          IsFounding 创始管理员标记（issue #120）：ADMIN_USERS 启动种入的账号为 true，
          管理端晋升与普通成员为 false。仅作前端展示分流（隐藏个人设置入口、
          抑制补全提示），不参与权限判定；GET 与 PUT /me 都必须返回——
          前端保存资料后会用 PUT 响应覆盖本地 profile，缺字段会让补全提示复活。
        type: boolean
      name:
        description: |-
          Name 是姓名（domain.User.Name），与 username 同源但语义独立：
          前端个人设置页把它当只读展示项。
        type: string
      role:
        type: string
      user_id:
        type: integer
      username:
        type: string
    type: object
  response.MyCandidate:
    properties:
      application_id:
        type: integer
      created_at:
        type: string
      direction:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  response.MyCandidateListResp:
    properties:
      items:
        items:
          $ref: '#/definitions/response.MyCandidate'
        type: array
      total:
        type: integer
    type: object
  response.MyInvitation:
    properties:
      accepted_at:
        type: string
      application_id:
        type: integer
      created_at:
        type: string
      direction:
        type: string
      expired:
        description: Expired 由服务端按查询时刻判定，前端不必自行比对过期时间。
        type: boolean
      expires_at:
        type: string
      status:
        type: string
      token:
        type: string
    type: object
  response.MyInvitationListResp:
    properties:
      items:
        items:
          $ref: '#/definitions/response.MyInvitation'
        type: array
      total:
        type: integer
    type: object
  response.RecruitmentApplicationDetailResp:
    properties:
      application:
        $ref: '#/definitions/response.RecruitmentApplicationResp'
      timeline:
        items:
          $ref: '#/definitions/response.RecruitmentTimelineResp'
        type: array
    type: object
  response.RecruitmentApplicationListResp:
    properties:
      items:
        items:
          $ref: '#/definitions/response.RecruitmentApplicationResp'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  response.RecruitmentApplicationResp:
    properties:
      class:
        type: string
      created_at:
        type: string
      direction_code:
        type: string
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      note:
        type: string
      qq:
        type: string
      round_id:
        type: integer
      status:
        type: string
      student_id:
        type: integer
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  response.RecruitmentDirectionFormResp:
    properties:
      id:
        type: integer
      is_open:
        type: boolean
      share_token:
        type: string
    type: object
  response.RecruitmentDirectionListResp:
    properties:
      items:
        items:
          $ref: '#/definitions/response.RecruitmentDirectionResp'
        type: array
    type: object
  response.RecruitmentDirectionResp:
    properties:
      code:
        type: string
      form:
        allOf:
        - $ref: '#/definitions/response.RecruitmentDirectionFormResp'
        description: |-
          Form 是该方向的面试表单；该方向无开放表单时为 null（指针类型才能序列化出 null，
          值类型会变成 {"id":0,...} 这种假对象，前端无法用 form === null 判断）。
      id:
        type: integer
      name:
        type: string
      open:
        type: boolean
      sort_order:
        type: integer
    type: object
  response.RecruitmentRoundListResp:
    properties:
      items:
        items:
          $ref: '#/definitions/response.RecruitmentRoundResp'
        type: array
    type: object
  response.RecruitmentRoundResp:
    properties:
      accepting:
        type: boolean
      id:
        type: integer
      name:
        type: string
      round_num:
        type: integer
    type: object
  response.RecruitmentTimelineResp:
    properties:
      created_at:
        type: string
      id:
        type: integer
      to_status:
        type: string
    type: object
  response.RefreshResp:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  response.Result:
    properties:
      code:
        description: 业务码：0 成功，非 0 失败
        type: integer
      data:
        description: 业务数据
      message:
        description: 提示信息
        type: string
    type: object
  response.ShareFormResp:
    properties:
      fields:
        items:
          $ref: '#/definitions/response.FormFieldResp'
        type: array
      form:
        $ref: '#/definitions/response.FormResp'
      my_submission_id:
        type: integer
      submitted:
        type: boolean
    type: object
  response.SubmitFormResp:
    properties:
      application_id:
        type: integer
      application_status:
        type: string
      submission:
        $ref: '#/definitions/response.FormSubmissionResp'
    type: object
  response.UserProfileDetail:
    properties:
      class:
        type: string
      direction:
        type: string
      email:
        type: string
      qq:
        type: string
      student_id:
        type: integer
    type: object
info:
  contact: {}
  description: |-
    IoT 全栈开发工作室的招新管理后台 API。
    统一响应体是 {code, message, data}；除公开端点（注册/登录/发码/刷新/登出）外都需要 Authorization: Bearer <access_token>。
  title: iot-pillot API
  version: 0.1.0
paths:
  /api/v1/admin/admins:
    get:
      description: 列出当前具备管理权限的账号。名单真源在 Redis。
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Result'
            - properties:
                data:
                  $ref: '#/definitions/response.AdminListResp'
              type: object
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.Result'
        "403":
          description: 非管理员
          schema:
            $ref: '#/definitions/response.Result'
      security:
      - BearerAuth: []
      summary: 管理员名单
      tags:
      - 管理端
    post:
      consumes:
      - application/json
      description: 把已注册用户加入管理员名单，并撤销其现有会话（旧令牌的 role 已过时，需重新登录）。
      parameters:
      - description: 目标用户
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.AdminUserIDReq'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            allOf:
            - $ref: '#/definitions/response.Result'
            - properties:
                data:
                  $ref: '#/definitions/response.AdminMutationResp'
              type: object
        "400":
          description: 参数错误或用户不存在
          schema:
            $ref: '#/definitions/response.Result'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.Result'
        "403":
          description: 非管理员
          schema:
            $ref: '#/definitions/response.Result'
      security:
