# CI：PR 与 main push 触发，验证编译/类型。
# 加完这个 workflow 后，branch protection 可以设 required_status_checks
# 来保证 auto-merge bot 只合并通过 CI 的 PR。

name: ci

on:
  pull_request:
    branches: [main]
  # 注意：这条目前是死触发器。auto-merge.yml 用默认 GITHUB_TOKEN 调 pulls.merge()
  # 合并 PR，而 GITHUB_TOKEN 产生的事件不会创建新的 workflow run，所以 main 前进
  # 时的 push 事件被系统吞掉（实测 push 触发的 run 数为 0）。保留它是因为哪天合并
  # 身份换成 PAT / GitHub App，它会自动复活。deploy.yml 同理。
  push:
    branches: [main]

# 同一分支连续 force-push 时，取消被顶掉的旧 run。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go (apps/api)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: apps/api/go.sum
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        run: go test ./...

  frontend:
    name: TypeScript (apps/web + shared-types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - name: pnpm install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm -r typecheck
      - name: build web
        run: pnpm --filter @iot-pillot/web build

  # 真正把镜像跑起来做黑盒断言。
  #
  # 为什么需要它：ci.yml 的 `go build ./...` 编译所有包，但从不执行 Dockerfile。
  # PR #13 把入口从 cmd/api 挪到 cmd 之后镜像构建坏了很久没人发现，就是因为
  # 没有任何 job 真正走过那条路径。
  #
  # 注意这一份**拦不住坏合并** —— auto-merge.yml 不等 CI 就合并。它的作用是
  # 早期信号，以及验证 deploy/smoke.sh 本身。真正的闸门是 deploy.yml 里
  # 同名脚本的那次调用，它跑在 scp 之前，坏镜像到不了服务器。
  image:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: iot_pillot
          POSTGRES_PASSWORD: iot_pillot
          POSTGRES_DB: iot_pillot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U iot_pillot -d iot_pillot"
          --health-interval 5s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: iot-pillot-api:ci
          cache-from: type=gha
          # 缓存只是加速手段，缓存服务抽风不该让 CI 变红
          cache-to: type=gha,mode=max,ignore-error=true

      # 用 host-gateway 而不是 --network host：容器内 nginx 监听 80，
      # 走桥接 + 端口映射就不必占用 runner 的 80 端口；
      # service container 的端口发布在宿主 localhost 上，容器内经 host.docker.internal 访问。
      - name: 启动容器
        run: |
          docker run -d --name smoke \
            -p 18080:80 \
            --add-host=host.docker.internal:host-gateway \
            -e IOT_PILOT_DB_HOST=host.docker.internal \
            -e IOT_PILOT_DB_PORT=5432 \
            -e IOT_PILOT_DB_USER=iot_pillot \
            -e IOT_PILOT_DB_PASSWORD=iot_pillot \
            -e IOT_PILOT_DB_NAME=iot_pillot \
            -e IOT_PILOT_REDIS_HOST=host.docker.internal \
            -e IOT_PILOT_REDIS_PORT=6379 \
            -e IOT_PILOT_JWT_SECRET=ci-only-not-a-real-secret \
            -e IOT_PILOT_MODE=release \
            iot-pillot-api:ci

      - name: 冒烟测试（HTTP 行为）
        run: bash deploy/smoke.sh http://127.0.0.1:18080

      # 放在 HTTP 断言之后：这一步会把容器杀掉。
      - name: 冒烟测试（进程监督语义）
        run: bash deploy/smoke-lifecycle.sh smoke

      # 失败时只有一个红叉最难查，把容器日志全量打出来。
      - name: 容器日志
        if: always()
        run: docker logs smoke 2>&1 || true
