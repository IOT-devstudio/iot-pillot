# CI：PR 与 main push 触发，验证编译/类型。
# 加完这个 workflow 后，branch protection 可以设 required_status_checks
# 来保证 auto-merge bot 只合并通过 CI 的 PR。

name: ci

on:
  pull_request:
    branches: [main]
  # 注意：这条目前是死触发器。auto-merge.yml 用默认 GITHUB_TOKEN 调 pulls.merge()
  # 合并 PR，而 GITHUB_TOKEN 产生的事件不会创建新的 workflow run，所以 main 前进
  # 时的 push 事件被系统吞掉（实测 push 触发的 run 数为 0）。保留它是因为哪天合并
  # 身份换成 PAT / GitHub App，它会自动复活。deploy.yml 同理。
  push:
    branches: [main]

# 同一分支连续 force-push 时，取消被顶掉的旧 run。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go (apps/api)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: apps/api/go.sum
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        run: go test ./...

  frontend:
    name: TypeScript (apps/web + shared-types)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - name: pnpm install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm -r typecheck
      - name: build web
        run: pnpm --filter @iot-pillot/web build
